<div class="container">
  <div class="header">

<script>
// ── Dynamic date (no more hardcoded TODAY) ───────────────────────────────────
const _now = new Date();
const TODAY = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}-${String(_now.getDate()).padStart(2,'0')}`;
const TODAY_D = new Date(TODAY + 'T00:00:00');
const MONTHS  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_W  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function wkStart(ds) {
  const d = new Date(ds+'T00:00:00'), day = d.getDay();
  d.setDate(d.getDate() - day + (day===0 ? -6 : 1));
  return d.toISOString().slice(0,10);
}
const _ws = wkStart(TODAY);
const _wsd = new Date(_ws+'T00:00:00');
document.getElementById('week-pill').textContent = `Week of ${_wsd.getDate()} ${MONTHS[_wsd.getMonth()]}`;
document.getElementById('today-pill').textContent = `${DAYS_W[TODAY_D.getDay()]} ${TODAY_D.getDate()} ${MONTHS[TODAY_D.getMonth()]}`;

// ── Config ───────────────────────────────────────────────────────────────────
const SK = 'rpm_v2';
const DEFAULT_SHEET_URL = 'https://rpm-dashboard-api.vercel.app/api/sheets';

const SC = {
  innovation: {label:'Innovation',         color:'#7F77DD', group:'work'},
  sales:      {label:'Sales mastery',      color:'#1D9E75', group:'work'},
  marketing:  {label:'Marketing',          color:'#378ADD', group:'work'},
  training:   {label:'Training',           color:'#6C8EBF', group:'support'},
  citizenship:{label:'Australian citizenship', color:'#E24B4A', group:'personal'},
  finances:   {label:'Finances',           color:'#BA7517', group:'personal'},
  realestate: {label:'Real estate',        color:'#D85A30', group:'personal'},
  health:     {label:'Health & energy',    color:'#5DCAA5', group:'personal'},
  brand:      {label:'Personal brand',     color:'#D4537E', group:'personal'},
  lifestyle:  {label:'Lifestyle',          color:'#888780', group:'personal'},
};
const GC = [
  {key:'work',     label:'Work — 3 to thrive',  streams:['innovation','sales','marketing']},
  {key:'support',  label:'Support & training',  streams:['training']},
  {key:'personal', label:'Personal RPM',         streams:['citizenship','finances','realestate','health','brand','lifestyle']},
];
const PC = {
  urgent:    {l:'Urgent',     bg:'#FCEBEB',tc:'#A32D2D'},
  priority:  {l:'Priority',   bg:'#FAECE7',tc:'#993C1D'},
  normal:    {l:'',           bg:'',       tc:''},
  backburner:{l:'Backburner', bg:'#F1EFE8',tc:'#5F5E5A'},
  awaiting:  {l:'Awaiting',   bg:'#FAEEDA',tc:'#854F0B'},
};
const PRI_ORDER = {urgent:0,priority:1,normal:2,backburner:3,awaiting:4};
const priCls = {urgent:'eu',priority:'ep',normal:'en',backburner:'eb',awaiting:'ea'};
const aCls   = {urgent:'au',priority:'ap',normal:'an',backburner:'ab',awaiting:'aa'};
const CAT_COLORS = ['#5DCAA5','#7F77DD','#D4537E','#378ADD','#E24B4A','#D85A30','#1D9E75','#6C8EBF','#BA7517','#888780','#A85555','#5A9A7A','#2E86AB','#E8A838','#9C89B8'];

// Pre-seeded RPM categories from Jacy's master plan
const DEFAULT_CATEGORIES = [
  {id:'cat01',name:'Physical Body',           color:'#5DCAA5'},
  {id:'cat02',name:'Wellbeing & Happiness',   color:'#7F77DD'},
  {id:'cat03',name:'Romance',                  color:'#D4537E'},
  {id:'cat04',name:'Friendships & Family',    color:'#378ADD'},
  {id:'cat05',name:'Adventure & Travel',      color:'#E24B4A'},
  {id:'cat06',name:'Energy & Rejuvenation',   color:'#5A9A7A'},
  {id:'cat07',name:'Contribution',             color:'#1D9E75'},
  {id:'cat08',name:'Jacy Enterprises',        color:'#6C8EBF'},
  {id:'cat09',name:'PlanTech Business',       color:'#2E86AB'},
  {id:'cat10',name:'Brand & Influence',       color:'#D85A30'},
  {id:'cat11',name:'Execution & Discipline',  color:'#888780'},
  {id:'cat12',name:'Finance & Wealth',        color:'#BA7517'},
  {id:'cat13',name:'Tax & Accounting',        color:'#A85555'},
  {id:'cat14',name:'Professional Connections',color:'#9C89B8'},
  {id:'cat15',name:'Mentoring & Team',        color:'#E8A838'},
  {id:'cat16',name:'Learning & Skills',       color:'#5DCAA5'},
  {id:'cat17',name:'Opportunities',           color:'#7F77DD'},
].map(c => ({...c, vision:'', purpose:'', result:'', createdAt:TODAY, archived:false}));

// ── State ─────────────────────────────────────────────────────────────────────
let tasks=[], log=[], categories=[];
let openSecs={}, tab='plan', activeFilters=new Set();
let editingId=null, editState={}, editSubs=[];
let addPri='normal', addSubs=[];
let sheetUrl=DEFAULT_SHEET_URL;
let editingCatId=null, editingCatState={};

// ── Helpers ───────────────────────────────────────────────────────────────────
function uid() { return 'u'+Date.now()+Math.random().toString(36).slice(2,5); }
function dd(d) { if(!d)return''; const[,m,day]=d.split('-'); return`${parseInt(day)} ${MONTHS[parseInt(m)-1]}`; }
function dn(d) { if(!d)return''; return DAYS_W[new Date(d+'T00:00:00').getDay()]; }
// Compare YYYY-MM-DD strings directly — avoids timezone parsing bugs
function isToday(t)  { return t.dueDate === TODAY; }
function isOv(t)     { return !!(t.dueDate && !t.done && t.dueDate < TODAY); }
function daysDiff(a,b) { return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function dpC(t)   { if(!t.dueDate||t.done)return''; if(t.dueDate<TODAY)return'ov'; if(t.dueDate===TODAY)return'sw'; return'ok'; }
function dpTxt(t) {
  if(!t.dueDate) return'+ due date';
  const s=`${dn(t.dueDate)} ${dd(t.dueDate)}`;
  if(t.done) return s;
  if(t.dueDate<TODAY) return`${s} · ${daysDiff(t.dueDate,TODAY)}d late`;
  if(t.dueDate===TODAY) return`${s} · today`;
  return s;
}
function bHtml(pri) { const p=PC[pri]; if(!p||!p.l)return''; return`<span class="bdg" style="background:${p.bg};color:${p.tc}">${p.l}</span>`; }
function leafCount(t) { return 1+(t.subs||[]).length; }
function doneCount(t) { return (t.done?1:0)+((t.subs||[]).filter(s=>s.done).length); }
function showSaved() {
  const el=document.getElementById('save-ind');
  if(!el)return;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),2000);
}

// ── Persistence ───────────────────────────────────────────────────────────────
async function save() {
  const payload={tasks,log,categories};
  if(sheetUrl) {
    try {
      const r=await fetch(sheetUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(r.ok){showSaved();return;}
      throw new Error('HTTP '+r.status);
    } catch(e) { console.warn('Sheet write failed, falling back to localStorage',e); }
  }
  localStorage.setItem(SK,JSON.stringify(payload));
  showSaved();
}

async function loadData() {
  if(sheetUrl) {
    try {
      const r=await fetch(sheetUrl);
      if(r.ok) {
        const d=await r.json();
        if(d.tasks&&d.tasks.length) {
          tasks=d.tasks;
          log=d.log||[];
          categories=(d.categories&&d.categories.length)?d.categories:DEFAULT_CATEGORIES;
          return;
        }
      }
    } catch(e){ console.warn('Sheet read failed',e); }
  }
  try {
    const raw=localStorage.getItem(SK);
    if(raw){const d=JSON.parse(raw);if(d.tasks&&d.tasks.length){tasks=d.tasks;log=d.log||[];categories=d.categories||DEFAULT_CATEGORIES;return;}}
  } catch(e){}
  tasks=[];log=[];categories=DEFAULT_CATEGORIES;
}

function connectSheet() {
  const url=(document.getElementById('sheet-url').value||'').trim();
  if(!url){alert('Paste your API URL first');return;}
  sheetUrl=url;
  localStorage.setItem('rpm_sheet_url',url);
  document.getElementById('sheet-status').textContent='Connecting...';
  loadData().then(()=>{
    document.getElementById('sheet-status').textContent='Connected';
    renderAll();
  }).catch(()=>document.getElementById('sheet-status').textContent='Connection failed');
}

// ── Copy for Claude ───────────────────────────────────────────────────────────
function copyForClaude() {
  const lines=['# My RPM Task List','',`Date: ${TODAY}`,`Total tasks: ${tasks.filter(t=>!t.done).length} open`,''  ];
  GC.forEach(g=>{
    const gTasks=tasks.filter(t=>g.streams.includes(t.stream)&&!t.done);
    if(!gTasks.length)return;
    lines.push(`## ${g.label}`);
    g.streams.forEach(s=>{
      const its=tasks.filter(t=>t.stream===s&&!t.done);
      if(!its.length)return;
      lines.push(`### ${SC[s].label}`);
      sortedTasks(its).forEach(t=>{
        let line=`- [${t.done?'x':' '}] ${t.text}`;
        if(t.pri&&t.pri!=='normal')line+=` [${PC[t.pri].l||t.pri}]`;
        if(t.dueDate)line+=` (due: ${t.dueDate}${isOv(t)?' LATE':''})`;
        if(t.isDailyVictory)line+=` ⭐`;
        if(t.isWeeklyFocus)line+=` 🚩`;
        lines.push(line);
        (t.subs||[]).forEach(s=>{
          let sl=`  - [${s.done?'x':' '}] ${s.text}`;
          if(s.dueDate)sl+=` (due: ${s.dueDate})`;
          lines.push(sl);
        });
        if(t.note)lines.push(`  *Note: ${t.note}*`);
      });
      lines.push('');
    });
  });
  const cats=categories.filter(c=>!c.archived);
  if(cats.length){
    lines.push('## RPM Categories');
    cats.forEach(c=>{
      const taskCount=tasks.filter(t=>t.categoryId===c.id&&!t.done).length;
      lines.push(`- **${c.name}** (${taskCount} open tasks)${c.result?': '+c.result.slice(0,80):''}`);
    });
  }
  const md=lines.join('\n');
  navigator.clipboard.writeText(md).then(()=>{
    const btn=document.querySelector('.copy-claude-btn');
    const orig=btn.textContent;
    btn.textContent='✓ Copied!';
    setTimeout(()=>btn.textContent=orig,2000);
  }).catch(()=>alert('Copy failed — try a different browser'));
}

// ── Filters ───────────────────────────────────────────────────────────────────
function toggleFilter(f) {
  if(activeFilters.has(f)) activeFilters.delete(f);
  else activeFilters.add(f);
  renderPlan();
}
function clearFilters() { activeFilters.clear(); renderPlan(); }
function taskVisible(t) {
  if(activeFilters.size===0) return true;
  for(const f of activeFilters) {
    if(f==='today'    && !isToday(t))                             return false;
    if(f==='late'     && !isOv(t))                                return false;
    if(f==='priority' && t.pri!=='urgent'&&t.pri!=='priority')    return false;
    if(f==='pending'  && t.done)                                   return false;
    if(f==='done'     && !t.done)                                  return false;
  }
  return true;
}

// ── Sort: priority then createdAt asc (older = higher) ───────────────────────
function sortedTasks(arr) {
  return [...arr].sort((a,b)=>{
    const pa=PRI_ORDER[a.pri]??2, pb=PRI_ORDER[b.pri]??2;
    if(pa!==pb) return pa-pb;
    const ca=a.createdAt||'9999', cb=b.createdAt||'9999';
    return ca<cb?-1:ca>cb?1:0;
  });
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function computeStats() {
  let total=0,done=0,todayC=0,lateC=0;
  tasks.forEach(t=>{
    total+=leafCount(t); done+=doneCount(t);
    if(isToday(t)&&!t.done) todayC++;
    if(isOv(t)) lateC++;
  });
  return{total,done,today:todayC,late:lateC,pct:total>0?Math.round(done/total*100):0};
}
function renderStats() {
  const s=computeStats();
  document.getElementById('stats-row').innerHTML=`
    <div class="stat"><div class="sl">Total items</div><div class="sv">${s.total}</div></div>
    <div class="stat"><div class="sl">Completed</div><div class="sv">${s.done}</div><div class="ss">${s.pct}% done</div></div>
    <div class="stat"><div class="sl">Due today</div><div class="sv">${s.today}</div><div class="ss">remaining</div></div>
    <div class="stat"><div class="sl">Late</div><div class="sv" style="${s.late>0?'color:#a32d2d':''}">${s.late}</div><div class="ss">${s.late>0?'overdue':'on track'}</div></div>`;
}

// ── Task actions ───────────────────────────────────────────────────────────────
async function togTask(id) {
  const t=tasks.find(t=>t.id===id); if(!t)return;
  t.done=!t.done;
  if(t.done){
    log.push({taskId:id,completedAt:TODAY,dueDate:t.dueDate||null,daysLate:t.dueDate?daysDiff(t.dueDate,TODAY):null,weekStart:wkStart(TODAY)});
  } else {
    log=log.filter(e=>e.taskId!==id);
  }
  await save(); renderAll();
}
async function togSub(tid,sid) {
  const t=tasks.find(t=>t.id===tid); if(!t)return;
  const s=t.subs.find(s=>s.id===sid); if(!s)return;
  s.done=!s.done; await save(); renderAll();
}
async function togVictory(id) {
  const t=tasks.find(t=>t.id===id); if(!t)return;
  if(!t.isDailyVictory){
    const count=tasks.filter(t=>t.isDailyVictory&&!t.done).length;
    if(count>=5){alert('You already have 5 Daily Victories. Remove one first to add another.');return;}
  }
  t.isDailyVictory=!t.isDailyVictory;
  await save(); renderAll();
}
async function togWeekFocus(id) {
  const t=tasks.find(t=>t.id===id); if(!t)return;
  t.isWeeklyFocus=!t.isWeeklyFocus;
  await save(); renderAll();
}

    if(!editSubs[i])return;
    if(el.classList.contains('sub-etxt'))  editSubs[i].text=el.value;

}
function syncAddSubsFromDOM() {
  document.querySelectorAll('[data-asub]').forEach(el=>{
    const i=parseInt(el.dataset.asub);

    if(el.classList.contains('sub-etxt'))  addSubs[i].text=el.value;
    if(el.classList.contains('sub-edate')) addSubs[i].dueDate=el.value;

}

// ── Sub due date display ──────────────────────────────────────────────────────
function subDueTxt(s) {
  if(!s.dueDate)return'';
  let cls='',note='';
  if(!s.done){
    if(s.dueDate<TODAY){cls=' late';note=` · ${daysDiff(s.dueDate,TODAY)}d late`;}
    else if(s.dueDate===TODAY){cls=' today';note=' · today';}
  }
  return`<span class="sub-due${cls}">${dn(s.dueDate)} ${dd(s.dueDate)}${note}</span>`;
}

// ── Task HTML ─────────────────────────────────────────────────────────────────
function taskHtml(t) {
  const isEdit=editingId===t.id;
  let h=`<div class="item">`;
  if(isToday(t)&&!t.done) h+=`<div class="today-dot"></div>`;
  h+=`<div class="chk${t.done?' dn':''}" onclick="togTask('${t.id}')"></div><div class="ib">`;
  h+=`<span class="it${t.done?' dn':''}">`;
  h+=t.text+bHtml(t.pri);
  if(isOv(t)&&!t.done) h+=`<span class="bdg" style="background:#fcebeb;color:#a32d2d">Late</span>`;
  h+=`<span class="dp ${dpC(t)}" onclick="startEdit('${t.id}')">${dpTxt(t)}</span></span>`;
  if(t.note&&!t.done) h+=`<div class="inote">${t.note}</div>`;
  if(isEdit) h+=editFormHtml(t);
  if(t.subs&&t.subs.length&&!isEdit) {
    h+=`<div class="subs">`;
    t.subs.forEach(s=>{
      h+=`<div class="sub"><div class="sc${s.done?' dn':''}" onclick="togSub('${t.id}','${s.id}')"></div><div class="sub-ib"><span class="st${s.done?' dn':''}">${s.text}</span>${subDueTxt(s)}</div></div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  h+=`<div class="task-acts">`;
  h+=`<button class="ib-btn star${t.isDailyVictory?' on':''}" onclick="togVictory('${t.id}')" title="⭐ Add to Daily Victories (max 5)">⭐</button>`;
  h+=`<button class="ib-btn flag${t.isWeeklyFocus?' on':''}" onclick="togWeekFocus('${t.id}')" title="🚩 Flag for this week">🚩</button>`;
  if(!isEdit) h+=`<button class="ib-btn" onclick="startEdit('${t.id}')" title="Edit">✏️</button>`;
  h+=`</div></div>`;
  return h;
}

// ── Plan view ─────────────────────────────────────────────────────────────────
function secProg(stream) {
  const its=tasks.filter(t=>t.stream===stream);
  let total=0,done=0;
  its.forEach(t=>{total+=leafCount(t);done+=doneCount(t);});
  return{total,done};
}

function renderPlan() {
  const filterDefs=[
    {f:'today',l:'Today'},{f:'late',l:'Late'},{f:'priority',l:'Priority'},
    {f:'pending',l:'Pending'},{f:'done',l:'Done'}
  ];
  let h=`<div class="ftabs">`;
  filterDefs.forEach(x=>{h+=`<button class="ftab${activeFilters.has(x.f)?' on':''}" onclick="toggleFilter('${x.f}')">${x.l}</button>`;});
  if(activeFilters.size>0) h+=`<button class="ftab-clear" onclick="clearFilters()">✕ clear</button>`;
  h+=`</div>`;
  h+=victoriesPanel();

  GC.forEach(g=>{
    const hasAny=g.streams.some(s=>tasks.find(t=>t.stream===s));
    if(!hasAny)return;
    let grpHtml='';
    g.streams.forEach(s=>{
      const cfg=SC[s];
      const its=sortedTasks(tasks.filter(t=>t.stream===s));
      if(!its.length)return;
      const isOpen=openSecs[s]!==false;
      const {total,done}=secProg(s);
      const pct=total>0?Math.round(done/total*100):0;
      let itsH='';
      its.forEach(t=>{
        if(!taskVisible(t)&&editingId!==t.id)return;
        itsH+=taskHtml(t);
      });
      if(!itsH&&activeFilters.size>0)return;
      grpHtml+=`<div class="sec">
        <div class="shd" onclick="toggleSec('${s}')">
          <div class="sdot" style="background:${cfg.color}"></div>
          <span class="stitle">${cfg.label}</span><span class="sct">${done}/${total}</span>
          <span class="sch${isOpen?' op':''}">&#9654;</span>
        </div>
        <div class="pb"><div class="pf" style="width:${pct}%;background:${cfg.color}"></div></div>
        <div class="its${isOpen?' op':''}">${itsH}</div>
      </div>`;
    });
    if(grpHtml) h+=`<div class="grp">${g.label}</div>`+grpHtml;
  });

  if(!h.includes('class="sec"')) h+=`<div class="empty">No tasks match the current filter</div>`;
  document.getElementById('plan-view').innerHTML=h;
}

// ── Categories view ───────────────────────────────────────────────────────────
function swatchesHtml(selectedColor) {
  return CAT_COLORS.map(c=>`<div class="swatch${c===selectedColor?' sel':''}" style="background:${c}" data-color="${c}" onclick="selectCatColor('${c}')"></div>`).join('');
}
function selectCatColor(color) {
  editingCatState.color=color;
  document.querySelectorAll('.swatch').forEach(el=>el.classList.toggle('sel',el.dataset.color===color));
}
function startEditCat(id) {
  if(editingCatId===id){editingCatId=null;renderCategories();return;}
  if(id==='new'){
    editingCatId='new';
    editingCatState={id:uid(),name:'',color:CAT_COLORS[0],vision:'',purpose:'',result:'',createdAt:TODAY,archived:false};
  } else {
    const c=categories.find(c=>c.id===id);
    if(!c)return;
    editingCatId=id;
    editingCatState={...c};
  }
  renderCategories();
}
async function saveCat() {
  if(!editingCatState.name.trim()){alert('Enter a category name');return;}
  const idx=categories.findIndex(c=>c.id===editingCatId);
  if(idx>=0) categories[idx]={...editingCatState};
  else categories.push({...editingCatState});
  editingCatId=null;
  await save(); renderCategories();
}
async function deleteCat(id) {
  if(!confirm('Delete this category? Tasks linked to it will lose the category link.'))return;
  categories=categories.filter(c=>c.id!==id);
  editingCatId=null;
  await save(); renderCategories();
}
function catEditForm(isNew) {
  return`<div class="cat-form">
    <label>Name</label>
    <input type="text" value="${(editingCatState.name||'').replace(/"/g,'&quot;')}" oninput="editingCatState.name=this.value" placeholder="Category name">
    <label>Colour</label>
    <div class="swatches">${swatchesHtml(editingCatState.color)}</div>
    <label>Vision <span style="color:#ccc;font-size:10px;text-transform:none">(what it looks like)</span></label>
    <textarea placeholder="Paint the picture of success…" oninput="editingCatState.vision=this.value">${editingCatState.vision||''}</textarea>
    <label>90-Day Result <span style="color:#ccc;font-size:10px;text-transform:none">(specific outcome)</span></label>
    <textarea placeholder="Specific measurable result in 90 days…" oninput="editingCatState.result=this.value">${editingCatState.result||''}</textarea>
    <div class="cat-btns">
      <button class="cat-save" onclick="saveCat()">Save</button>
      <button class="cat-cancel" onclick="editingCatId=null;renderCategories()">Cancel</button>
      ${!isNew?`<button class="cat-del" onclick="deleteCat('${editingCatState.id}')">Delete</button>`:''}
    </div>
  </div>`;
}
function renderCategories() {
  const active=categories.filter(c=>!c.archived);
  let h=`<div class="cat-grid">`;
  active.forEach(c=>{
    const tc=tasks.filter(t=>t.categoryId===c.id).length;
    const isEd=editingCatId===c.id;
    h+=`<div>
      <div class="cat-card${isEd?' open':''}" onclick="startEditCat('${c.id}')">
        <div class="cat-hd">
          <div class="cat-dot" style="background:${c.color}"></div>
          <span class="cat-nm">${c.name}</span>
          <span class="cat-ct">${tc} task${tc!==1?'s':''}</span>
        </div>
        ${c.result?`<div style="font-size:11px;color:#aaa;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${c.result.slice(0,60)}${c.result.length>60?'…':''}</div>`:''}
      </div>
      ${isEd?catEditForm(false):''}
    </div>`;
  });
  h+=`</div>`;
  h+=`<button class="add-cat-btn" onclick="startEditCat('new')">+ Add category</button>`;
  if(editingCatId==='new') h+=catEditForm(true);
  document.getElementById('categories-view').innerHTML=h;
}

// ── Analytics view ────────────────────────────────────────────────────────────
function renderAnalytics() {
  const ov=tasks.filter(t=>isOv(t));
  const thisWk=wkStart(TODAY);
  const lastWkD=new Date(TODAY_D); lastWkD.setDate(lastWkD.getDate()-7);
  const lastWk=wkStart(lastWkD.toISOString().slice(0,10));
  const twLog=log.filter(e=>e.weekStart===thisWk);
  const lwLog=log.filter(e=>e.weekStart===lastWk);
  const twOT=twLog.filter(e=>e.dueDate&&(e.daysLate===null||e.daysLate<=0)).length;
  const lwOT=lwLog.filter(e=>e.dueDate&&(e.daysLate===null||e.daysLate<=0)).length;
  const twDelta=twLog.length-lwLog.length;

  let h=`<div class="stats" style="margin-bottom:1rem">
    <div class="stat"><div class="sl">All-time completed</div><div class="sv">${log.length}</div></div>
    <div class="stat"><div class="sl">This week</div><div class="sv">${twLog.length}</div><div class="ss" style="${twDelta>=0?'color:#1d9e75':'color:#a32d2d'}">${twDelta>=0?'+':''}${twDelta} vs last week</div></div>
    <div class="stat"><div class="sl">On-time this week</div><div class="sv">${twOT}</div><div class="ss">vs ${lwOT} last week</div></div>
    <div class="stat"><div class="sl">Currently late</div><div class="sv" style="${ov.length>0?'color:#a32d2d':''}">${ov.length}</div></div>
  </div>`;

  h+=`<div class="acard"><div class="atitle">Progress by stream</div>`;
  Object.entries(SC).forEach(([k,v])=>{
    const its=tasks.filter(t=>t.stream===k);
    if(!its.length)return;
    let tot=0,dn=0;
    its.forEach(t=>{tot+=leafCount(t);dn+=doneCount(t);});
    const pct=tot>0?Math.round(dn/tot*100):0;
    h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <div style="width:8px;height:8px;border-radius:50%;background:${v.color};flex-shrink:0"></div>
      <span style="font-size:12px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${v.label}</span>
      <span style="font-size:11px;color:#999;width:40px;text-align:right">${dn}/${tot}</span>
      <div style="width:110px;height:5px;border-radius:3px;background:#eee;overflow:hidden"><div style="height:100%;width:${pct}%;background:${v.color};border-radius:3px"></div></div>
      <span style="font-size:11px;color:#bbb;width:32px;text-align:right">${pct}%</span>
    </div>`;
  });
  h+=`</div>`;

  h+=`<div class="acard"><div class="atitle">Overdue items</div>`;
  if(!ov.length){h+=`<div class="empty">No overdue items 🎉</div>`;}
  else{
    h+=`<table class="otbl"><tr><th>Task</th><th>Stream</th><th>Days late</th></tr>`;
    ov.sort((a,b)=>(a.dueDate<b.dueDate?-1:1)).forEach(t=>{
      const dv=daysDiff(t.dueDate,TODAY);
      h+=`<tr><td style="max-width:220px">${t.text}</td><td>${SC[t.stream]?.label||t.stream}</td><td style="color:#a32d2d;font-weight:600">${dv}d</td></tr>`;
    });
    h+=`</table>`;
  }
  h+=`</div>`;
  document.getElementById('analytics-view').innerHTML=h;
}

// ── Render all ────────────────────────────────────────────────────────────────
function renderAll() {
  renderStats();
  if(tab==='plan')       renderPlan();
  else if(tab==='add')   renderAdd();
  else if(tab==='categories') renderCategories();
  else if(tab==='analytics')  renderAnalytics();
}
function toggleSec(id) { openSecs[id]=openSecs[id]===false?true:false; renderAll(); }
function setTab(t) {
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['plan','add','categories','analytics'].forEach(v=>{
    document.getElementById(v+'-view').style.display=t===v?'block':'none';
  });
  renderAll();
}
