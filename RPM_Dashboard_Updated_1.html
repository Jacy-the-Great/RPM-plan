<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPM Weekly Plan — Jacy Macnee</title>
<style>
:root{--bg:#fafaf8;--surface:#fff;--fg:#222;--fg2:#555;--border:#eee;--border2:#ddd;--subtle:#f5f5f5;--muted:#888;--accent:#378ADD}
.dark{--bg:#1a1b1e;--surface:#252629;--fg:#e8e8e8;--fg2:#aaa;--border:#333;--border2:#444;--subtle:#2a2b2e;--muted:#888;--accent:#5a9fd4}
body{background:var(--bg);color:var(--fg)}
.container{background:var(--bg)}
.card,.item,.add-card,.ef,.victories-panel,.deleg-panel,.prio-panel,.ai-tab-layout,.str-card,.str-exp{background:var(--surface);border-color:var(--border)}
.tab{background:var(--surface);color:var(--fg2);border-color:var(--border2)}
.tab.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
select,input,textarea{background:var(--surface)!important;color:var(--fg)!important;border-color:var(--border2)!important}
.inote{color:var(--fg2)}
.prio-panel{background:var(--subtle);border-color:var(--border)}
.gsheet-bar{background:var(--subtle);border-color:var(--border)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f8f8f6;color:#222;font-size:14px;line-height:1.6}
.container{max-width:960px;margin:0 auto;padding:2rem 1.5rem}
.header{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:2px solid #222}
.header h1{font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px}
.header p{font-size:13px;color:#888;font-style:italic}
.header-meta{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;align-items:center}
.meta-pill{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid #ddd;color:#555}
.save-ind{font-size:11px;color:#1d9e75;opacity:0;transition:opacity .4s;margin-left:auto}
.save-ind.show{opacity:1}
.tabs{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}
.tab{padding:7px 18px;border-radius:99px;border:1px solid #ccc;cursor:pointer;font-size:13px;background:#fff;color:#555;transition:all .15s}
.tab.on{background:#222;color:#fff;border-color:#222;font-weight:500}
.ftabs{display:flex;gap:5px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
.ftab{padding:4px 12px;border-radius:99px;border:1px solid #ddd;cursor:pointer;font-size:11px;background:#fff;color:#888;transition:all .12s;user-select:none}
.ftab.on{background:#222;color:#fff;border-color:#222;font-weight:600}
.ftab-clear{padding:4px 10px;border-radius:99px;border:1px solid #eee;cursor:pointer;font-size:11px;background:transparent;color:#bbb;transition:all .12s;margin-left:2px}
.ftab-clear:hover{color:#888;border-color:#ddd}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.5rem}
.stat{background:#fff;border:1px solid #eee;border-radius:8px;padding:12px 14px}
.sl{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.sv{font-size:22px;font-weight:600;color:#222}
.ss{font-size:11px;color:#999;margin-top:2px}
/* Victories panel */
.victories-panel{background:#fffcf0;border:1px solid #e4cb78;border-radius:10px;padding:12px 16px;margin-bottom:.75rem}
.victories-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.victories-ttl{font-size:11px;font-weight:700;color:#7a5c0a;text-transform:uppercase;letter-spacing:.08em;flex:1}
.victories-hint{font-size:10px;color:#b89030;font-style:italic}
.victory-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.vchk{width:14px;height:14px;border-radius:3px;border:1.5px solid #d4a820;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.vchk.dn{background:#BA7517;border-color:#BA7517}
.vchk.dn::after{content:'';display:block;width:7px;height:5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(0,-1px)}
.vtxt{font-size:12px;color:#5a4008}
.vtxt.dn{text-decoration:line-through;color:#c0aa70}
/* Delegation panel */
.deleg-panel{background:#f0f4ff;border:1px solid #c0d0f0;border-radius:10px;padding:12px 16px;margin-bottom:1.25rem}
.deleg-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.deleg-ttl{font-size:11px;font-weight:700;color:#2050a0;text-transform:uppercase;letter-spacing:.08em;flex:1}
.deleg-hint{font-size:10px;color:#6080c0;font-style:italic}
.deleg-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.deleg-badge{font-size:10px;padding:1px 7px;border-radius:99px;background:#dde8ff;color:#3050a0;font-weight:600;white-space:nowrap}
/* Delegation choice inline */
.dc-wrap{background:#eef2ff;border:1px solid #b0c0f0;border-radius:8px;padding:10px 12px;margin:6px 0}
.dc-title{font-size:11px;font-weight:700;color:#2050a0;margin-bottom:8px}
.dc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dc-self{padding:5px 14px;border-radius:6px;border:none;background:#222;color:#fff;font-size:12px;cursor:pointer;font-family:Arial,sans-serif;font-weight:600}
.dc-divider{font-size:11px;color:#aaa}
.dc-inp{flex:1;min-width:110px;font-size:12px;padding:5px 9px;border:1px solid #c0d0f0;border-radius:6px;outline:none;font-family:Arial,sans-serif}
.dc-del{padding:5px 14px;border-radius:6px;border:none;background:#378ADD;color:#fff;font-size:12px;cursor:pointer;font-family:Arial,sans-serif;font-weight:600}
.dc-cancel{padding:5px 10px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#aaa;font-size:12px;cursor:pointer;font-family:Arial,sans-serif}
/* Sections */
.grp{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.1em;margin:1.5rem 0 .75rem;display:flex;align-items:center;gap:8px}
.grp::after{content:'';flex:1;height:1px;background:#e5e5e5}
.sec{margin-bottom:.75rem}
.shd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#f3f3f0;border-radius:8px;cursor:pointer;border:1px solid #e8e8e5;user-select:none}
.sdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.stitle{font-size:13px;font-weight:600;color:#222;flex:1}
.sct{font-size:11px;color:#999}
.sch{font-size:11px;color:#bbb;transition:transform .18s;flex-shrink:0}
.sch.op{transform:rotate(90deg)}
.pb{height:3px;border-radius:2px;background:#e5e5e5;margin-top:5px;overflow:hidden}
.pf{height:100%;border-radius:2px;transition:width .3s}
.its{display:none;padding-top:6px}
.its.op{display:block}
/* Task items */
.item:hover{background:var(--subtle)}
.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid #ccc;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chk.dn{background:#222;border-color:#222}
.chk.dn::after{content:'';display:block;width:8px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0,-1px)}
.cat-pip{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:6px}
.ib{flex:1;min-width:0}
.it{font-size:13px;color:#222;line-height:1.5}
.it.dn{text-decoration:line-through;color:#bbb}
.inote{font-size:11px;color:#999;margin-top:3px;font-style:italic;line-height:1.4}
/* Subtasks */
.subs{margin-top:4px;padding-left:2px}
.sub{display:flex;align-items:flex-start;gap:8px;padding:3px 0}
.sc{width:13px;height:13px;border-radius:3px;border:1.5px solid #ddd;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.sc.dn{background:#888;border-color:#888}
.sc.dn::after{content:'';display:block;width:6px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(0,-1px)}
.sub-ib{flex:1;min-width:0}
.st{font-size:12px;color:#777;line-height:1.5}
.st.dn{text-decoration:line-through;color:#ccc}
.sub-due{font-size:10px;color:#aaa;margin-left:5px;white-space:nowrap}
.sub-due.late{color:#a32d2d}.sub-due.today{color:#854f0b}
/* Badges / dates */
.bdg{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;font-weight:600;margin-left:5px;vertical-align:middle}
.dp{display:inline-flex;font-size:10px;padding:1px 7px;border-radius:99px;margin-left:6px;cursor:pointer;border:1px solid #ddd;color:#aaa;vertical-align:middle;transition:all .12s}
.dp:hover{background:#f5f5f2}
.dp.ov{border-color:#f09595;color:#a32d2d;background:#fcebeb}
.dp.sw{border-color:#ef9f27;color:#854f0b;background:#faeeda}
.dp.ok{border-color:#5dcaa5;color:#0f6e56;background:#e1f5ee}
/* Icon buttons */
.task-acts{display:flex;gap:1px;flex-shrink:0;align-items:flex-start;margin-top:1px}
.ib-btn{width:22px;height:22px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:all .15s;padding:0;line-height:1}
.ib-btn:hover{background:#eee;opacity:.8}
.ib-btn.on{opacity:1}
.ib-btn.star.on{color:#BA7517}
.ib-btn.flag.on{color:#378ADD}
.ib-btn.delegate.on{color:#2050a0}
/* Edit form */
.ef{background:#f5f5f2;border-radius:8px;padding:12px 14px;margin:5px 0 10px;border:1px solid #e0e0dc}
.ef label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px;margin-top:8px}
.ef label:first-child{margin-top:0}
.ef input,.ef select,.ef textarea{width:100%;font-size:12px;padding:7px 9px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#222;outline:none;font-family:Arial,sans-serif;display:block}
.ef textarea{resize:vertical;min-height:52px}
.efr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eprow{display:flex;gap:4px;margin-top:3px}
.epb{flex:1;padding:5px 2px;border-radius:6px;border:1px solid #ddd;font-size:11px;cursor:pointer;background:#fff;color:#888;font-family:Arial,sans-serif;transition:all .12s;text-align:center}
.epb.eu{background:#fcebeb;color:#a32d2d;border-color:#f09595}
.epb.ep{background:#faece7;color:#993c1d;border-color:#f0997b}
.epb.en{background:#f3f3f0;color:#222;border-color:#ccc}
.epb.eb{background:#f1efe8;color:#5f5e5a;border-color:#b4b2a9}
.epb.ea{background:#faeeda;color:#854f0b;border-color:#ef9f27}
.efbtns{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.ef-save{padding:6px 16px;border-radius:6px;border:none;background:#222;color:#fff;font-size:12px;cursor:pointer;font-family:Arial,sans-serif;font-weight:600}
.ef-cancel{padding:6px 16px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#888;font-size:12px;cursor:pointer;font-family:Arial,sans-serif}
.ef-del{padding:6px 12px;border-radius:6px;border:1px solid #f09595;background:#fff;color:#a32d2d;font-size:12px;cursor:pointer;font-family:Arial,sans-serif;margin-left:auto}
.chk-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:#555;cursor:pointer}
.chk-row input[type=checkbox]{width:14px;height:14px;cursor:pointer;flex-shrink:0}
.sub-erow{display:flex;align-items:center;gap:6px;margin-top:4px}
.sub-etxt{flex:1!important;min-width:0!important;width:auto!important;font-size:12px;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--fg);outline:none;font-family:Arial,sans-serif}
.sub-edate{width:120px!important;flex:none!important;font-size:12px;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--fg);outline:none;font-family:Arial,sans-serif}
.sub-xbtn{width:20px;height:20px;border:none;background:transparent;cursor:pointer;color:#ccc;font-size:15px;flex-shrink:0;padding:0;border-radius:4px;line-height:1}
.sub-xbtn:hover{background:#fee;color:#a32d2d}
.add-sub-btn{font-size:11px;color:#888;background:transparent;border:1px dashed #ddd;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:Arial,sans-serif;margin-top:4px;width:100%;text-align:left;transition:all .12s}
.add-sub-btn:hover{border-color:#aaa;color:#555}
/* Add card */
.add-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:1.25rem;margin-bottom:1.25rem}
.add-card label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px;margin-top:10px}
.add-card label:first-child{margin-top:0}
.add-card input,.add-card select,.add-card textarea{width:100%;font-size:13px;padding:8px 10px;border:1px solid #ddd;border-radius:7px;background:#fff;color:#222;outline:none;font-family:Arial,sans-serif;display:block}
.add-card textarea{resize:vertical;min-height:60px}
.ar2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aprow{display:flex;gap:6px;margin-top:3px}
.apb{flex:1;padding:7px 3px;border-radius:7px;border:1px solid #ddd;font-size:12px;cursor:pointer;background:#fff;color:#888;font-family:Arial,sans-serif;transition:all .15s;text-align:center}
.apb.au{background:#fcebeb;color:#a32d2d;border-color:#f09595}
.apb.ap{background:#faece7;color:#993c1d;border-color:#f0997b}
.apb.an{background:#f3f3f0;color:#222;border-color:#ccc}
.apb.ab{background:#f1efe8;color:#5f5e5a;border-color:#b4b2a9}
.apb.aa{background:#faeeda;color:#854f0b;border-color:#ef9f27}
.a-submit{width:100%;padding:10px;border-radius:7px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:#222;color:#fff;font-family:Arial,sans-serif;margin-top:12px}
.a-submit:hover{background:#444}
.aflash{font-size:12px;color:#1d9e75;opacity:0;transition:opacity .3s;margin-left:8px}
.aflash.show{opacity:1}
/* Categories */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.cat-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:11px 14px;cursor:pointer;transition:all .15s}
.cat-card:hover{border-color:#ccc;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cat-hd{display:flex;align-items:center;gap:9px}
.cat-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.cat-nm{font-size:13px;font-weight:600;color:#222;flex:1}
.cat-ct{font-size:11px;color:#aaa;white-space:nowrap}
.cat-form{background:#f5f5f2;border-radius:8px;padding:12px 14px;margin-top:6px;border:1px solid #e0e0dc}
.cat-form label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px;margin-top:8px}
.cat-form label:first-child{margin-top:0}
.cat-form input,.cat-form textarea{width:100%;font-size:12px;padding:7px 9px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#222;outline:none;font-family:Arial,sans-serif;display:block}
.cat-form textarea{resize:vertical;min-height:56px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s}
.swatch:hover{transform:scale(1.2)}
.swatch.sel{border-color:#222;transform:scale(1.15)}
.cat-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.cat-save{padding:6px 16px;border-radius:6px;border:none;background:#222;color:#fff;font-size:12px;cursor:pointer;font-family:Arial,sans-serif;font-weight:600}
.cat-cancel{padding:6px 16px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#888;font-size:12px;cursor:pointer;font-family:Arial,sans-serif}
.cat-del{padding:6px 12px;border-radius:6px;border:1px solid #f09595;background:#fff;color:#a32d2d;font-size:12px;cursor:pointer;font-family:Arial,sans-serif;margin-left:auto}
.add-cat-btn{width:100%;padding:10px;border-radius:8px;border:1px dashed #ddd;font-size:13px;cursor:pointer;background:transparent;color:#888;font-family:Arial,sans-serif;margin-top:4px;transition:all .15s}
.add-cat-btn:hover{border-color:#aaa;color:#555;background:#f5f5f2}
/* Cat goal bar */
.cat-goal-bar{margin-top:6px}
.cat-goal-hd{display:flex;justify-content:space-between;font-size:10px;color:#aaa;margin-bottom:3px}
.cat-goal-track{height:4px;background:#eee;border-radius:2px;overflow:hidden}
.cat-goal-fill{height:100%;border-radius:2px;transition:width .3s}
/* Analytics */
.acard{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:1rem 1.25rem;margin-bottom:1rem}
.atitle{font-size:13px;font-weight:600;color:#222;margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.atitle-sub{font-size:11px;color:#aaa;font-weight:400;margin-left:auto}
.otbl{width:100%;border-collapse:collapse;font-size:12px}
.otbl th{color:#aaa;font-weight:600;text-align:left;padding:5px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #eee}
.otbl td{padding:7px 7px;border-bottom:1px solid #f0f0f0;color:#333}
.otbl tr:last-child td{border-bottom:none}
.empty{font-size:13px;color:#bbb;padding:1.5rem 0;text-align:center}
/* Trend chart */
.trend-chart{display:flex;gap:4px;align-items:flex-end;height:64px;margin:8px 0 2px}
.trend-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:0;position:relative}
.trend-col:hover .trend-tip{display:block}
.trend-tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:10px;background:#333;color:#fff;padding:3px 7px;border-radius:5px;white-space:nowrap;z-index:10;pointer-events:none}
.trend-bar-del{width:100%;border-radius:3px 3px 0 0;min-height:0;background:#378ADD;opacity:.75}
.trend-bar-self{width:100%;min-height:0;background:#7F77DD}
.trend-bar-empty{width:100%;height:2px;background:#eee;border-radius:3px}
.trend-labels{display:flex;gap:4px;margin-top:3px}
.trend-lbl{flex:1;font-size:9px;color:#ccc;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trend-legend{display:flex;gap:14px;margin-top:6px}
.trend-leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#888}
.trend-leg-dot{width:8px;height:8px;border-radius:2px}
/* Streak cards */
.streak-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1rem}
.streak-card{background:#fff;border:1px solid #eee;border-radius:8px;padding:12px 14px;text-align:center}
.streak-num{font-size:26px;font-weight:700;color:#222}
.streak-lbl{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
/* Progress bar inline */
.prog-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.prog-label{font-size:12px;color:#333;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.prog-counts{font-size:11px;color:#aaa;width:40px;text-align:right;flex-shrink:0}
.prog-bar{width:100px;height:5px;border-radius:3px;background:#eee;overflow:hidden;flex-shrink:0}
.prog-fill{height:100%;border-radius:3px}
.prog-pct{font-size:11px;color:#bbb;width:32px;text-align:right;flex-shrink:0}
/* Sheet bar */
.gsheet-bar{background:#f3f3f0;border:1px solid #e5e5e2;border-radius:8px;padding:8px 14px;margin-bottom:1.25rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gsheet-bar input{flex:1;min-width:180px;font-size:12px;padding:5px 9px;border:1px solid #ddd;border-radius:6px;background:#fff;font-family:Arial,sans-serif;outline:none;color:#222}
.gsheet-btn{padding:5px 12px;border-radius:6px;border:none;background:#555;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:Arial,sans-serif;white-space:nowrap}
.gsheet-btn:hover{background:#333}
.gsheet-status{font-size:11px;color:#888;font-style:italic}
.copy-claude-btn{padding:5px 12px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#888;font-size:12px;cursor:pointer;font-family:Arial,sans-serif;white-space:nowrap;margin-left:auto}
.copy-claude-btn:hover{background:#f5f5f2;color:#555}
.today-dot{width:7px;height:7px;border-radius:50%;background:#378ADD;display:inline-block;margin-right:4px;flex-shrink:0;margin-top:5px}
/* AI Assistant tab styles */

function uid(){return 'u'+Date.now()+Math.random().toString(36).slice(2,5);}
function dd(d){if(!d)return'';const[,m,day]=d.split('-');return`${parseInt(day)} ${MONTHS[parseInt(m)-1]}`;}
function dn(d){if(!d)return'';return DAYS_W[new Date(d+'T00:00:00').getDay()];}
function isToday(t){return t.dueDate===TODAY;}
function isOv(t){return !!(t.dueDate&&!t.done&&t.dueDate<TODAY);}
function daysDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function dpC(t){if(!t.dueDate||t.done)return'';if(t.dueDate<TODAY)return'ov';if(t.dueDate===TODAY)return'sw';return'ok';}
function dpTxt(t){
  if(!t.dueDate)return'+ due date';
  const s=`${dn(t.dueDate)} ${dd(t.dueDate)}`;
  if(t.done)return s;
  if(t.dueDate<TODAY)return`${s} · ${daysDiff(t.dueDate,TODAY)}d late`;
  if(t.dueDate===TODAY)return`${s} · today`;
  return s;
}
function bHtml(pri){const p=PC[pri];if(!p||!p.l)return'';return`<span class="bdg" style="background:${p.bg};color:${p.tc}">${p.l}</span>`;}
function leafCount(t){return 1+(t.subs||[]).length;}
function doneCount(t){return(t.done?1:0)+((t.subs||[]).filter(s=>s.done).length);}
function showSaved(){const el=document.getElementById('save-ind');if(!el)return;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2000);}
function catOf(t){return categories.find(c=>c.id===t.categoryId);}

// ── Stream helpers (Issue 9: use strategy categories) ────────────────────────
function getStreamOpts(selectedVal){
  if(!rpmPlan||!rpmPlan.categories||!rpmPlan.categories.length){
    return Object.entries(SC).map(([k,v])=>`<option value="${k}"${selectedVal===k?' selected':''}>${v.label}</option>`).join('');
  }
  return rpmPlan.categories.map(c=>`<option value="${c.id}"${selectedVal===c.id?' selected':''}>${c.number}. ${c.name}</option>`).join('');
}
function streamColor(val){
  if(!val)return'#ccc';
  const cat=rpmPlan?.categories?.find(c=>c.id===val);
  if(cat)return cat.color;
  return SC[val]?.color||'#ccc';
}
function streamLabel(val){
  if(!val)return'';
  const cat=rpmPlan?.categories?.find(c=>c.id===val);
  if(cat)return cat.name;
  return SC[val]?.label||val;
}

// ── Persistence ───────────────────────────────────────────────────────────────
async function save(){
  const payload={tasks,log,categories,priorities,rpmPlan};
  localStorage.setItem(SK,JSON.stringify({tasks,log,categories,priorities})); // tasks/log/cats (no strategy - separate key)
  localStorage.setItem('rpm_priorities',JSON.stringify(priorities));
  localStorage.setItem('rpm_strategy',JSON.stringify(rpmPlan));
  if(sheetUrl){
    try{const r=await fetch(sheetUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(r.ok){showSaved();return;}throw new Error('HTTP '+r.status);}
    catch(e){console.warn('Sheet write failed',e);}
  }
  showSaved();
}
async function loadData(){
  if(sheetUrl){
    try{
      const r=await fetch(sheetUrl);
      if(r.ok){const d=await r.json();if(d.tasks&&d.tasks.length){tasks=d.tasks;log=d.log||[];categories=(d.categories&&d.categories.length)?d.categories:DEFAULT_CATEGORIES;if(d.priorities)priorities={...priorities,...d.priorities};if(d.strategy&&d.strategy.categories&&d.strategy.categories.length)rpmPlan=d.strategy;return;}}
    }catch(e){console.warn('Sheet read failed',e);}
  }
  try{const raw=localStorage.getItem(SK);if(raw){const d=JSON.parse(raw);if(d.tasks&&d.tasks.length){tasks=d.tasks;log=d.log||[];categories=d.categories||DEFAULT_CATEGORIES;if(d.priorities)priorities={...priorities,...d.priorities};return;}}}catch(e){}
  tasks=[];log=[];categories=DEFAULT_CATEGORIES;
}
function connectSheet(){
  const url=(document.getElementById('sheet-url').value||'').trim();
  if(!url){alert('Paste your API URL first');return;}
  sheetUrl=url;localStorage.setItem('rpm_sheet_url',url);
  document.getElementById('sheet-status').textContent='Connecting...';
  loadData().then(()=>{document.getElementById('sheet-status').textContent='Connected';updateApiPill();renderAll();})
    .catch(()=>document.getElementById('sheet-status').textContent='Connection failed');
}

// ── Copy for Claude ───────────────────────────────────────────────────────────
function copyForClaude(){
  const lines=['# My RPM Task List','',`Date: ${TODAY}`,`Open tasks: ${tasks.filter(t=>!t.done).length}`,''];
  GC.forEach(g=>{
    const gT=tasks.filter(t=>g.streams.includes(t.stream)&&!t.done);if(!gT.length)return;
    lines.push(`## ${g.label}`);
    g.streams.forEach(s=>{
      const its=tasks.filter(t=>t.stream===s&&!t.done);if(!its.length)return;
      lines.push(`### ${SC[s].label}`);
      sortedTasks(its).forEach(t=>{
        let l=`- [ ] ${t.text}`;
        if(t.pri&&t.pri!=='normal')l+=` [${PC[t.pri].l||t.pri}]`;
        if(t.dueDate)l+=` (due: ${t.dueDate}${isOv(t)?' LATE':''})`;
        if(t.isDailyVictory)l+=` ⭐`;
        if(t.isWeeklyFocus)l+=` 🚩`;
        if(t.delegateIntent)l+=` 🤝${t.delegatedTo?' → '+t.delegatedTo:''}`;
        lines.push(l);
        (t.subs||[]).forEach(s=>{let sl=`  - [ ] ${s.text}`;if(s.dueDate)sl+=` (due: ${s.dueDate})`;lines.push(sl);});
        if(t.note)lines.push(`  *${t.note}*`);
      });lines.push('');
    });
  });
  const md=lines.join('\n');
  navigator.clipboard.writeText(md).then(()=>{const btn=document.querySelector('.copy-claude-btn');const orig=btn.textContent;btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent=orig,2000);}).catch(()=>alert('Copy failed'));
}

// ── Filters ───────────────────────────────────────────────────────────────────
function toggleFilter(f){if(activeFilters.has(f))activeFilters.delete(f);else activeFilters.add(f);localStorage.setItem('rpm_filters',JSON.stringify([...activeFilters]));renderPlan();}
function clearFilters(){activeFilters.clear();localStorage.removeItem('rpm_filters');renderPlan();}
function taskVisible(t){
  if(activeFilters.size===0)return true;
  for(const f of activeFilters){
    if(f==='today'     &&!isToday(t))                           return false;
    if(f==='late'      &&!isOv(t))                              return false;
    if(f==='priority'  &&t.pri!=='urgent'&&t.pri!=='priority')  return false;
    if(f==='pending'   &&t.done)                                return false;
    if(f==='done'      &&!t.done)                               return false;
    if(f==='delegating'&&!t.delegateIntent)                     return false;
  }
  return true;
}

// ── Sort ──────────────────────────────────────────────────────────────────────
function sortedTasks(arr){
  return[...arr].sort((a,b)=>{
    const pa=PRI_ORDER[a.pri]??2,pb=PRI_ORDER[b.pri]??2;
    if(pa!==pb)return pa-pb;
    const ca=a.createdAt||'9999',cb=b.createdAt||'9999';
    return ca<cb?-1:ca>cb?1:0;
  });
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function computeStats(){
  let total=0,done=0,todayC=0,lateC=0,delegateC=0;
  tasks.forEach(t=>{
    total+=leafCount(t);done+=doneCount(t);
    if(isToday(t)&&!t.done)todayC++;
    if(isOv(t))lateC++;
    if(t.delegateIntent&&!t.done)delegateC++;
  });
  return{total,done,today:todayC,late:lateC,delegate:delegateC,pct:total>0?Math.round(done/total*100):0};
}
function renderStats(){
  const s=computeStats();
  document.getElementById('stats-row').innerHTML=`
    <div class="stat"><div class="sl">Total items</div><div class="sv">${s.total}</div></div>
    <div class="stat"><div class="sl">Completed</div><div class="sv">${s.done}</div><div class="ss">${s.pct}% done</div></div>
    <div class="stat"><div class="sl">Due today</div><div class="sv">${s.today}</div><div class="ss">remaining</div></div>
    <div class="stat"><div class="sl">Late</div><div class="sv" style="${s.late>0?'color:#a32d2d':''}">${s.late}</div><div class="ss">${s.late>0?'overdue':'on track'}</div></div>
    <div class="stat"><div class="sl">To delegate</div><div class="sv" style="${s.delegate>0?'color:#2050a0':''}">${s.delegate}</div><div class="ss">pending</div></div>`;
}

// ── Task actions ──────────────────────────────────────────────────────────────
async function togTask(id){
  const t=tasks.find(t=>t.id===id);if(!t)return;
  // Unchecking — always just un-done
  if(t.done){
    t.done=false;t.delegatedTo='';
    log=log.filter(e=>e.taskId!==id);
    await save();renderAll();return;
  }
  // Marking done — check for delegation intent
  if(t.delegateIntent&&!pendingDelegationId){
    pendingDelegationId=id;renderAll();
    setTimeout(()=>{const inp=document.getElementById('dc-inp-'+id);if(inp)inp.focus();},60);
    return;
  }
  // Normal done
  t.done=true;
  log.push({taskId:id,completedAt:TODAY,dueDate:t.dueDate||null,daysLate:t.dueDate?daysDiff(t.dueDate,TODAY):null,weekStart:wkStart(TODAY),delegatedTo:''});
  pendingDelegationId=null;await save();renderAll();
}
async function togSub(tid,sid){const t=tasks.find(t=>t.id===tid);if(!t)return;const s=t.subs.find(s=>s.id===sid);if(!s)return;s.done=!s.done;await save();renderAll();}
async function completeDelegation(id,delegatedTo){
  const t=tasks.find(t=>t.id===id);if(!t)return;
  t.done=true;t.delegatedTo=delegatedTo||'';
  log.push({taskId:id,completedAt:TODAY,dueDate:t.dueDate||null,daysLate:t.dueDate?daysDiff(t.dueDate,TODAY):null,weekStart:wkStart(TODAY),delegatedTo:delegatedTo||''});
  pendingDelegationId=null;await save();renderAll();
}
function completeDelegationInput(id){
  const inp=document.getElementById('dc-inp-'+id);
  completeDelegation(id,inp?(inp.value.trim()):'');
}
function cancelDelegation(){pendingDelegationId=null;renderAll();}
async function togVictory(id){
  const t=tasks.find(t=>t.id===id);if(!t)return;
  if(!t.isDailyVictory&&tasks.filter(t=>t.isDailyVictory&&!t.done).length>=5){alert('You already have 5 Daily Victories. Remove one first.');return;}
  t.isDailyVictory=!t.isDailyVictory;await save();renderAll();
}
async function togWeekFocus(id){const t=tasks.find(t=>t.id===id);if(!t)return;t.isWeeklyFocus=!t.isWeeklyFocus;await save();renderAll();}
function resetStaleVictories(){
  const todayDone=new Set(log.filter(e=>e.completedAt===TODAY).map(e=>e.taskId));
  let changed=false;
  tasks.forEach(t=>{
    if(t.isDailyVictory&&t.done&&!todayDone.has(t.id)){
      t.isDailyVictory=false;changed=true;
    }
  });
  if(changed)save();
}
async function togDelegateIntent(id){
  const t=tasks.find(t=>t.id===id);if(!t)return;
  t.delegateIntent=!t.delegateIntent;
  if(!t.delegateIntent)t.delegatedTo='';
  await save();renderAll();
}

function syncEditSubsFromDOM(){document.querySelectorAll('[data-esub]').forEach(el=>{const i=parseInt(el.dataset.esub);if(!editSubs[i])return;if(el.classList.contains('sub-etxt'))editSubs[i].text=el.value;if(el.classList.contains('sub-edate'))editSubs[i].dueDate=el.value;});}
function syncAddSubsFromDOM(){document.querySelectorAll('[data-asub]').forEach(el=>{const i=parseInt(el.dataset.asub);if(!addSubs[i])return;if(el.classList.contains('sub-etxt'))addSubs[i].text=el.value;if(el.classList.contains('sub-edate'))addSubs[i].dueDate=el.value;});}
function startEdit(id){
  const t=tasks.find(t=>t.id===id);if(!t)return;
  editingId=id;
  editState={text:t.text,stream:t.stream,pri:t.pri,dueDate:t.dueDate||'',note:t.note||'',categoryId:t.categoryId||'',delegateIntent:t.delegateIntent||false,delegatedTo:t.delegatedTo||''};
  editSubs=(t.subs||[]).map(s=>({...s}));
  renderAll();
  setTimeout(()=>{const el=document.getElementById('ef-text');if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length;}},60);
}
function selEP(p){editState.pri=p;document.querySelectorAll('.epb').forEach(b=>{b.className='epb';if(b.dataset.pri===p)b.classList.add(priCls[p]);});}
function selAP(p){addPri=p;document.querySelectorAll('.apb').forEach(b=>{b.className='apb';if(b.dataset.p===p)b.classList.add(aCls[p]);});}
function addEditSub(){syncEditSubsFromDOM();editSubs.push({id:uid(),text:'',done:false,dueDate:'',createdAt:TODAY});renderAll();setTimeout(()=>{const els=document.querySelectorAll('[data-esub].sub-etxt');if(els.length)els[els.length-1].focus();},50);}
function removeEditSub(i){syncEditSubsFromDOM();editSubs.splice(i,1);renderAll();}
function addAddSub(){syncAddSubsFromDOM();addSubs.push({id:uid(),text:'',done:false,dueDate:'',createdAt:TODAY});renderAdd();setTimeout(()=>{const els=document.querySelectorAll('[data-asub].sub-etxt');if(els.length)els[els.length-1].focus();},50);}
function removeAddSub(i){syncAddSubsFromDOM();addSubs.splice(i,1);renderAdd();}
async function saveEdit(){
  syncEditSubsFromDOM();
  const t=tasks.find(t=>t.id===editingId);if(!t)return;
  t.text=editState.text;t.stream=editState.stream;t.pri=editState.pri;
  t.dueDate=editState.dueDate;t.note=editState.note;t.categoryId=editState.stream;
  t.subs=editSubs.filter(s=>s.text.trim());
  t.delegateIntent=editState.delegateIntent;t.delegatedTo=editState.delegatedTo;
  editingId=null;await save();renderAll();
}
function cancelEdit(){editingId=null;renderAll();}
async function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);editingId=null;await save();renderAll();}

// ── Sub due date display ──────────────────────────────────────────────────────
function subDueTxt(s){
  if(!s.dueDate)return'';
  let cls='',note='';
  if(!s.done){if(s.dueDate<TODAY){cls=' late';note=` · ${daysDiff(s.dueDate,TODAY)}d late`;}else if(s.dueDate===TODAY){cls=' today';note=' · today';}}
  return`<span class="sub-due${cls}">${dn(s.dueDate)} ${dd(s.dueDate)}${note}</span>`;
}

// ── Task HTML ─────────────────────────────────────────────────────────────────
function toggleTask(id){openTasks[id]=!openTasks[id];renderAll();}
function taskHtml(t){
  const isEdit=editingId===t.id;
  const isPending=pendingDelegationId===t.id;
  const isOpen=openTasks[t.id]||isEdit||isPending;
  const cat=catOf(t);
  const catColor=cat?cat.color:streamColor(t.stream);

  let h=`<div class="item${isOpen?' item-open':''}">`;
  // Left accent stripe
  h+=`<div class="item-stripe" style="background:${catColor}"></div>`;
  // Checkbox
  h+=`<div class="chk${t.done?' dn':''}" onclick="togTask('${t.id}')"></div>`;
  // Main content
  h+=`<div class="ib">`;
  h+=`<div class="item-compact-row">`;
  h+=`<span class="it${t.done?' dn':''}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.text}</span>`;
  if(bHtml(t.pri))h+=bHtml(t.pri);
  if(isOv(t)&&!t.done)h+=`<span class="bdg" style="background:#fcebeb;color:#a32d2d;flex-shrink:0">Late</span>`;
  if(t.delegateIntent&&!t.done){const n=t.delegatedTo?`🤝 ${t.delegatedTo}`:'🤝';h+=`<span class="bdg" style="background:#e8eeff;color:#2050a0;flex-shrink:0">${n}</span>`;}
  if(t.createdAt&&!t.done){const da=daysDiff(t.createdAt,TODAY);if(da>=30)h+=`<span class="task-age old" title="Added ${t.createdAt}">${da}d</span>`;}
  h+=`<span class="dp ${dpC(t)}" onclick="startEdit('${t.id}')" style="flex-shrink:0">${dpTxt(t)}</span>`;
  h+=`</div>`; // end item-compact-row

  // Expanded content
  if(isOpen){
    if(t.note&&!t.done)h+=`<div class="inote">${t.note}</div>`;
    if(isPending){h+=`<div class="dc-wrap"><div class="dc-title">🤝 How was this completed?</div><div class="dc-row"><button class="dc-self" onclick="completeDelegation('${t.id}','')">✓ I did it</button><span class="dc-divider">or</span><input type="text" id="dc-inp-${t.id}" class="dc-inp" placeholder="Delegated to (name)…" onkeydown="if(event.key==='Enter')completeDelegationInput('${t.id}')"><button class="dc-del" onclick="completeDelegationInput('${t.id}')">✓ Delegated</button><button class="dc-cancel" onclick="cancelDelegation()">Cancel</button></div></div>`;}
    if(isEdit)h+=editFormHtml(t);
    if(t.subs&&t.subs.length&&!isEdit&&!isPending){h+=`<div class="subs">`;t.subs.forEach(s=>{h+=`<div class="sub"><div class="sc${s.done?' dn':''}" onclick="togSub('${t.id}','${s.id}')"></div><div class="sub-ib"><span class="st${s.done?' dn':''}">${s.text}</span>${subDueTxt(s)}</div></div>`;});h+=`</div>`;}
    // Action buttons only when expanded
    h+=`<div class="task-acts">`;
    h+=`<button class="ib-btn star${t.isDailyVictory?' on':''}" onclick="togVictory('${t.id}')" title="⭐ Daily Victory">⭐</button>`;
    h+=`<button class="ib-btn flag${t.isWeeklyFocus?' on':''}" onclick="togWeekFocus('${t.id}')" title="🚩 This Week">🚩</button>`;
    h+=`<button class="ib-btn delegate${t.delegateIntent?' on':''}" onclick="togDelegateIntent('${t.id}')" title="🤝 Delegate">🤝</button>`;
    if(!isEdit)h+=`<button class="ib-btn" onclick="startEdit('${t.id}')" title="Edit">✏️</button>`;
    h+=`</div>`;
  }
  h+=`</div>`; // end ib

  // Chevron expand button
  if(!isEdit&&!isPending)h+=`<button class="task-chevron" onclick="toggleTask('${t.id}')" title="${isOpen?'Collapse':'Expand'}">${isOpen?'▼':'▶'}</button>`;
  h+=`</div>`;
  return h;
}

function secProg(stream){const its=tasks.filter(t=>t.stream===stream);let total=0,done=0;its.forEach(t=>{total+=leafCount(t);done+=doneCount(t);});return{total,done};}
function renderPlan(){
  const filterDefs=[{f:'today',l:'Today'},{f:'late',l:'Late'},{f:'priority',l:'Priority'},{f:'pending',l:'Pending'},{f:'done',l:'Done'},{f:'delegating',l:'🤝 Delegating'}];
  let h=prioritiesPanel();
  h+=`<div class="ftabs">`;
  filterDefs.forEach(x=>{h+=`<button class="ftab${activeFilters.has(x.f)?' on':''}" onclick="toggleFilter('${x.f}')">${x.l}</button>`;});
  if(activeFilters.size>0)h+=`<button class="ftab-clear" onclick="clearFilters()">✕ clear</button>`;
  h+=`</div>`;
  h+=victoriesPanel();
  h+=delegationPanel();
  GC.forEach(g=>{
    const hasAny=g.streams.some(s=>tasks.find(t=>t.stream===s));if(!hasAny)return;
    let grpHtml='';
    g.streams.forEach(s=>{
      const cfg=SC[s];
      const its=sortedTasks(tasks.filter(t=>t.stream===s));if(!its.length)return;
      const isOpen=openSecs[s]!==false;
      const{total,done}=secProg(s);const pct=total>0?Math.round(done/total*100):0;
      const sColor=streamColor(s);const sLabel=streamLabel(s)||cfg?.label||s;
      let itsH='';
      its.forEach(t=>{if(!taskVisible(t)&&editingId!==t.id)return;itsH+=taskHtml(t);});
      if(!itsH&&activeFilters.size>0)return;
      grpHtml+=`<div class="sec">
        <div class="shd" onclick="toggleSec('${s}')"><div class="sdot" style="background:${sColor}"></div><span class="stitle">${sLabel}</span><span class="sct">${done}/${total}</span><span class="sch${isOpen?' op':''}">&#9654;</span></div>
        <div class="pb"><div class="pf" style="width:${pct}%;background:${sColor}"></div></div>
        <div class="its${isOpen?' op':''}">${itsH}</div>
      </div>`;
    });
    if(grpHtml)h+=`<div class="grp">${g.label}</div>`+grpHtml;
  });
  if(!h.includes('class="sec"'))h+=`<div class="empty">No tasks match the current filters</div>`;
  document.getElementById('plan-view').innerHTML=h;
}

function startEditCat(id){

// ── Analytics (Wave 3) ────────────────────────────────────────────────────────
function renderAnalytics(){
  const thisWk=wkStart(TODAY);
  const lastWkD=new Date(TODAY_D);lastWkD.setDate(lastWkD.getDate()-7);
  const lastWk=wkStart(lastWkD.toISOString().slice(0,10));
  const twLog=log.filter(e=>e.weekStart===thisWk);
  const lwLog=log.filter(e=>e.weekStart===lastWk);
  const twDel=twLog.filter(e=>e.delegatedTo&&e.delegatedTo.trim());
  const lwDel=lwLog.filter(e=>e.delegatedTo&&e.delegatedTo.trim());
  const twDelta=twLog.length-lwLog.length;
  const twDelDelta=twDel.length-lwDel.length;
  const ov=tasks.filter(t=>isOv(t));

  // 8-week trend
  const weeks=[];
  for(let i=7;i>=0;i--){
    const d=new Date(TODAY_D);d.setDate(d.getDate()-i*7);
    const ws=wkStart(d.toISOString().slice(0,10));
    const wd=new Date(ws+'T00:00:00');
    const wl=log.filter(e=>e.weekStart===ws);
    weeks.push({label:`${wd.getDate()} ${MONTHS[wd.getMonth()].slice(0,3)}`,total:wl.length,delegated:wl.filter(e=>e.delegatedTo&&e.delegatedTo.trim()).length});
  }
  const maxTotal=Math.max(...weeks.map(w=>w.total),1);

  // Streaks
  let compStreak=0;
  const checkD=new Date(TODAY_D);
  for(let i=0;i<365;i++){
    const ds=checkD.toISOString().slice(0,10);
    const had=log.some(e=>e.completedAt===ds);
    if(!had&&ds!==TODAY)break;
    if(had)compStreak++;
    checkD.setDate(checkD.getDate()-1);
  }
  let delStreak=0;
  const checkW=new Date(TODAY_D);
  for(let i=0;i<52;i++){
    const ws=wkStart(checkW.toISOString().slice(0,10));
    const had=log.some(e=>e.weekStart===ws&&e.delegatedTo);
    if(!had)break;
    delStreak++;
    checkW.setDate(checkW.getDate()-7);
  }
  const pendingDel=tasks.filter(t=>t.delegateIntent&&!t.done).length;

  // Delegation success rate
  const doneWithIntent=tasks.filter(t=>t.done&&t.delegateIntent);
  const successDel=doneWithIntent.filter(t=>t.delegatedTo);
  const delSuccessRate=doneWithIntent.length>0?Math.round(successDel.length/doneWithIntent.length*100):null;

  // By person
  const byPerson={};
  log.filter(e=>e.delegatedTo&&e.delegatedTo.trim()).forEach(e=>{const n=e.delegatedTo.trim();byPerson[n]=(byPerson[n]||0)+1;});
  const topPeople=Object.entries(byPerson).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // By stream: delegation rate
  const byStream={};
  log.forEach(e=>{
    const t=tasks.find(t=>t.id===e.taskId);if(!t)return;
    if(!byStream[t.stream])byStream[t.stream]={total:0,delegated:0};
    byStream[t.stream].total++;
    if(e.delegatedTo&&e.delegatedTo.trim())byStream[t.stream].delegated++;
  });

  // Category progress
  const catProgress=categories.filter(c=>!c.archived).map(c=>{
    const ct=tasks.filter(t=>t.categoryId===c.id);
    const open=ct.filter(t=>!t.done).length;
    const done=ct.filter(t=>t.done).length;
    return{cat:c,open,done,total:ct.length};
  }).filter(cp=>cp.total>0).sort((a,b)=>b.total-a.total);

  // ── Render ─────────────────────────────────────────────────────────────────
  let h=`<div class="stats" style="margin-bottom:1rem">
    <div class="stat"><div class="sl">All-time done</div><div class="sv">${log.length}</div></div>
    <div class="stat"><div class="sl">This week</div><div class="sv">${twLog.length}</div><div class="ss" style="${twDelta>=0?'color:#1d9e75':'color:#a32d2d'}">${twDelta>=0?'+':''}${twDelta} vs last wk</div></div>
    <div class="stat"><div class="sl">Delegated this wk</div><div class="sv" style="color:#2050a0">${twDel.length}</div><div class="ss" style="${twDelDelta>=0?'color:#1d9e75':'color:#a32d2d'}">${twDelDelta>=0?'+':''}${twDelDelta} vs last wk</div></div>
    <div class="stat"><div class="sl">Currently late</div><div class="sv" style="${ov.length>0?'color:#a32d2d':''}">${ov.length}</div></div>
    <div class="stat"><div class="sl">Pending delegation</div><div class="sv" style="${pendingDel>0?'color:#2050a0':''}">${pendingDel}</div></div>
  </div>`;

  // Streak row
  h+=`<div class="streak-row">
    <div class="streak-card"><div class="streak-num">${compStreak}</div><div class="streak-lbl">day completion streak</div></div>
    <div class="streak-card"><div class="streak-num">${delStreak}</div><div class="streak-lbl">week delegation streak</div></div>
    <div class="streak-card"><div class="streak-num">${delSuccessRate!==null?delSuccessRate+'%':'—'}</div><div class="streak-lbl">delegation success rate</div></div>
  </div>`;

  // 8-week trend
  const trendBars=weeks.map(w=>{
    const selfH=Math.round((w.total-w.delegated)/maxTotal*60);
    const delH=Math.round(w.delegated/maxTotal*60);
    return`<div class="trend-col">
      <div class="trend-tip">${w.label}: ${w.total} done${w.delegated?', '+w.delegated+' delegated':''}</div>
      ${delH>0?`<div class="trend-bar-del" style="height:${delH}px"></div>`:''}
      ${selfH>0?`<div class="trend-bar-self" style="height:${selfH}px;border-radius:${delH===0?'3px 3px':'0 0'} 0 0"></div>`:''}
      ${w.total===0?`<div class="trend-bar-empty"></div>`:''}
    </div>`;
  }).join('');
  const trendLbls=weeks.map(w=>`<div class="trend-lbl">${w.label}</div>`).join('');
  h+=`<div class="acard">
    <div class="atitle">8-Week Completion Trend <span class="atitle-sub">${twLog.length} completions this week</span></div>
    <div class="trend-chart">${trendBars}</div>
    <div class="trend-labels">${trendLbls}</div>
    <div class="trend-legend">
      <div class="trend-leg-item"><div class="trend-leg-dot" style="background:#7F77DD"></div>Done by you</div>
      <div class="trend-leg-item"><div class="trend-leg-dot" style="background:#378ADD"></div>Delegated</div>
    </div>
  </div>`;

  // Delegation by person
  h+=`<div class="acard"><div class="atitle">Delegation by Person <span class="atitle-sub">${log.filter(e=>e.delegatedTo).length} total delegations</span></div>`;
  if(!topPeople.length){h+=`<div class="empty">No delegations recorded yet. Use the 🤝 flag to start tracking.</div>`;}
  else{
    topPeople.forEach(([name,count])=>{
      const maxCount=topPeople[0][1];
      const pct=Math.round(count/maxCount*100);
      h+=`<div class="prog-row"><div class="prog-label">🤝 ${name}</div><div class="prog-counts">${count}</div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:#378ADD"></div></div><div class="prog-pct">${count}x</div></div>`;
    });
  }
  h+=`</div>`;

  // Delegation by stream
  const streamDelEntries=Object.entries(byStream).filter(([,v])=>v.total>0);
  if(streamDelEntries.length>0){
    h+=`<div class="acard"><div class="atitle">Delegation by Stream</div>`;
    streamDelEntries.sort((a,b)=>b[1].delegated-a[1].delegated).forEach(([k,v])=>{
      const pct=v.total>0?Math.round(v.delegated/v.total*100):0;
      const cfg=SC[k];if(!cfg)return;
      h+=`<div class="prog-row"><div class="prog-label"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${cfg.color};margin-right:5px;vertical-align:middle"></span>${cfg.label}</div><div class="prog-counts">${v.delegated}/${v.total}</div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${cfg.color}"></div></div><div class="prog-pct">${pct}%</div></div>`;
    });
    h+=`</div>`;
  }

  // Stream progress
  h+=`<div class="acard"><div class="atitle">Progress by Stream</div>`;
  Object.entries(SC).forEach(([k,v])=>{
    const its=tasks.filter(t=>t.stream===k);if(!its.length)return;
    let tot=0,dn=0;its.forEach(t=>{tot+=leafCount(t);dn+=doneCount(t);});
    const pct=tot>0?Math.round(dn/tot*100):0;
    h+=`<div class="prog-row"><div class="prog-label"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${v.color};margin-right:5px;vertical-align:middle"></span>${v.label}</div><div class="prog-counts">${dn}/${tot}</div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${v.color}"></div></div><div class="prog-pct">${pct}%</div></div>`;
  });
  h+=`</div>`;

  // Category progress (goal line of sight)
  if(catProgress.length>0){
    h+=`<div class="acard"><div class="atitle">RPM Category Progress <span class="atitle-sub">goal line of sight</span></div>`;
    catProgress.forEach(({cat,open,done,total})=>{
      const pct=total>0?Math.round(done/total*100):0;
      h+=`<div style="margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
          <div style="width:9px;height:9px;border-radius:50%;background:${cat.color};flex-shrink:0"></div>
          <span style="font-size:12px;font-weight:600;flex:1">${cat.name}</span>
          <span style="font-size:11px;color:#aaa">${done}/${total} · ${pct}%</span>
        </div>
        ${cat.result?`<div style="font-size:11px;color:#888;margin-bottom:4px;padding-left:17px;line-height:1.4">→ ${cat.result.slice(0,100)}${cat.result.length>100?'…':''}</div>`:''}
        <div style="padding-left:17px"><div style="height:5px;background:#eee;border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${cat.color};border-radius:3px;transition:width .3s"></div></div></div>
      </div>`;
    });
    h+=`</div>`;
  }

  // Overdue items
  h+=`<div class="acard"><div class="atitle">Overdue Items</div>`;
  if(!ov.length){h+=`<div class="empty">No overdue items 🎉</div>`;}
  else{
    h+=`<table class="otbl"><tr><th>Task</th><th>Stream</th><th>Days late</th><th>Delegate?</th></tr>`;
    ov.sort((a,b)=>(a.dueDate<b.dueDate?-1:1)).forEach(t=>{
      const dv=daysDiff(t.dueDate,TODAY);
      h+=`<tr><td style="max-width:200px">${t.text}</td><td>${SC[t.stream]?.label||t.stream}</td><td style="color:#a32d2d;font-weight:600">${dv}d</td><td style="color:${t.delegateIntent?'#2050a0':'#ccc'}">${t.delegateIntent?'🤝 yes':'—'}</td></tr>`;
    });
    h+=`</table>`;
  }
  h+=`</div>`;
  document.getElementById('analytics-view').innerHTML=h;
}

let voiceRec = null, voiceActive = false;
function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Voice input not supported in this browser. Try Chrome or Safari.'); return; }
  const btn = document.getElementById('voice-btn');
  if(voiceActive && voiceRec){ voiceRec.stop(); return; }
  voiceRec = new SR();
  voiceRec.continuous = true;
  voiceRec.interimResults = false;
  voiceRec.lang = 'en-AU';
  voiceRec.onstart = ()=>{
    voiceActive = true;
    if(btn){ btn.textContent='🔴'; btn.classList.add('active'); btn.title='Tap to stop'; }
  };
  voiceRec.onresult = (e)=>{
    const transcript = Array.from(e.results).map(r=>r[0].transcript).join(' ');
    const inp = document.getElementById('chat-input');
    if(inp) inp.value = (inp.value ? inp.value + ' ' : '') + transcript;
  };
  voiceRec.onerror = (e)=>{
    console.error('Voice error:', e.error);
    voiceActive = false;
    if(btn){ btn.textContent='🎤'; btn.classList.remove('active'); btn.title='Tap to speak'; }
  };
  voiceRec.onend = ()=>{
    voiceActive = false;
    if(btn){ btn.textContent='🎤'; btn.classList.remove('active'); btn.title='Tap to speak'; }
  };
  voiceRec.start();
  if(tab!=='ai') setTab('ai');
}

      }

function parseTaskFromAI(aiText){
  const taskMatch=/TASK:\s*(.+?)(?:\n|$)/i.exec(aiText);
  const categoryMatch=/CATEGORY:\s*(.+?)(?:\n|$)/i.exec(aiText);
  const assignedMatch=/ASSIGNED_TO:\s*(.+?)(?:\n|$)/i.exec(aiText);
  const priorityMatch=/PRIORITY:\s*(.+?)(?:\n|$)/i.exec(aiText);
  const dueMatch=/DUE:\s*(.+?)(?:\n|$)/i.exec(aiText);
  const subtasksMatch=/SUBTASKS:\s*((?:[-•]\s*.+(?:\n|$))*)/i.exec(aiText);
  const noteMatch=/NOTE:\s*(.+?)(?:\n|$)/i.exec(aiText);

  let subs=[];
  if(subtasksMatch&&subtasksMatch[1]){
    subs=subtasksMatch[1]
      .split('\n')
      .map(line=>line.replace(/^[-•]\s*/,'').trim())
      .filter(line=>line.length>0)
      .map(text=>({id:uid(),text,done:false,dueDate:'',createdAt:TODAY}));
  }

  let dueDate='';
  if(dueMatch&&dueMatch[1]&&!/leave blank|not specified|n\/a|none|tbd/i.test(dueMatch[1])){
    const dueStr=dueMatch[1].trim().toLowerCase();
    const d=new Date();
    if(dueStr==='today') dueDate=TODAY;
    else if(dueStr==='tomorrow'){d.setDate(d.getDate()+1);dueDate=d.toISOString().split('T')[0];}
    else if(dueStr==='next week'){d.setDate(d.getDate()+7);dueDate=d.toISOString().split('T')[0];}
    else if(/^\d{4}-\d{2}-\d{2}$/.test(dueStr)) dueDate=dueStr;
  }

  let pri=priorityMatch&&priorityMatch[1]?priorityMatch[1].trim().toLowerCase():'normal';
  if(!['urgent','priority','normal','backburner','awaiting'].includes(pri)) pri='normal';

  const delegateTo=assignedMatch&&assignedMatch[1]&&!/leave blank|n\/a|none/i.test(assignedMatch[1])?assignedMatch[1].trim():'';

  return{
    text:taskMatch&&taskMatch[1]?taskMatch[1].trim():'',
    categoryId:categoryMatch&&categoryMatch[1]?categoryMatch[1].trim():'',
    priority:pri,
    dueDate,
    subs,
    note:noteMatch&&noteMatch[1]?noteMatch[1].trim():'',
    delegateIntent:delegateTo.length>0,
    delegatedTo:delegateTo,
  };
}

function addChatTaskFromPreview(idx){
  const msg=chatMessages[idx];
  if(!msg||!msg.taskData)return;
  const td=msg.taskData;
  if(!td.text){alert('Task text is required');return;}
  const stream=document.getElementById('ctf-stream-'+idx)?.value||'innovation';
  const pri=document.getElementById('ctf-pri-'+idx)?.value||'normal';
  const catId=document.getElementById('ctf-cat-'+idx)?.value||'';
  const dueDate=document.getElementById('ctf-due-'+idx)?.value||'';
  const delegateTo=(document.getElementById('ctf-del-'+idx)?.value||'').trim();
  tasks.push({
    id:uid(),stream,text:td.text,pri,dueDate,
    note:td.note||'',done:false,subs:td.subs||[],
    categoryId:catId,createdAt:TODAY,
    isDailyVictory:false,isWeeklyFocus:false,
    delegateIntent:delegateTo.length>0,
    delegatedTo:delegateTo,
  });
  save();renderAll();
  const btn=event.target;btn.textContent='✓ Added!';btn.disabled=true;
}

async function sendChat(){
  const input=document.getElementById('chat-input');
  const msg=input.value.trim();
  if(!msg)return;

  input.value='';
  chatMessages.push({role:'user',content:msg});
  chatLoading=true;
  renderChat();

  try{
    const r=await fetch(OPENAI_API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg,categories,streams:Object.keys(SC),priorities,tasks:tasks.filter(t=>!t.done).slice(0,40)})
    });
    if(!r.ok)throw new Error('API error');
    const d=await r.json();
    const taskData=d.taskData;
    chatMessages.push({role:'assistant',content:d.response,taskData});
  }catch(e){
    chatMessages.push({role:'assistant',content:'Sorry, I encountered an error. Please try again.'});
    console.error('Chat error:',e);
  }
  chatLoading=false;
  renderChat();
}

function quickPrompt(prompt){
  document.getElementById('chat-input').value=prompt;
  sendChat();
}

     threeToThrive:['Visibility (content, speaking, networking; the input that creates inbound opportunities)','Readiness (having a clear offer, a clear brand, a way for opportunities to convert)','Saying yes strategically (evaluate each opportunity against my vision, not just ego)'],
     resources:['LinkedIn platform','PIA and industry networks','Speaking track record','Land iQ reputation','Conference platforms','Personal website (to be built)'],
     oneYearResult:'Received at least 3 inbound speaking invitations. Been approached for at least one partnership or collaboration. Have a personal website that people can find and contact me through. At least one media feature or industry publication mention.',
     oneYearPurpose:'Because being an opportunities magnet isn\'t magic; it\'s the compound return on consistent visibility and value creation.',
     ninetyDayResult:'Receive at least one unsolicited professional opportunity. Ensure LinkedIn profile is fully optimised. Make it easy for someone to understand what I do in 30 seconds.',
     ninetyDayPurpose:'Because the opportunities I attract in the next 90 days are determined by the visibility I build starting now.',
     ninetyDayMap:[
       {id:'mx17a',text:'Ensure LinkedIn profile is fully optimised with clear positioning',done:false,priority:true,pushedToTask:false},
       {id:'mx17b',text:'Say yes to one opportunity outside my comfort zone this quarter',done:false,priority:false,pushedToTask:false},
       {id:'mx17c',text:'After every conference or event, follow up with 5 new contacts within 48 hours',done:false,priority:false,pushedToTask:false},
     ],
     weeklyIntegration:'The review question is: "Did any new opportunity appear this week? Did I respond to it properly?"',
     score:5,updatedAt:TODAY},
  ]};
}

function scoreColor(s){
  if(s<=4)return'#e74c3c';
  if(s<=7)return'#e67e22';
  return'#27ae60';
}

function mapProgress(cat){
  const items=cat.ninetyDayMap||[];
  return{done:items.filter(i=>i.done).length,total:items.length};
}

function loadStrategy(){
  try{
    const raw=localStorage.getItem('rpm_strategy');
    if(raw){const d=JSON.parse(raw);if(d&&d.categories&&d.categories.length){rpmPlan=d;return;}}
  }catch(e){}
  rpmPlan=defaultRpmPlan();
}

function saveStrategy(){
  localStorage.setItem('rpm_strategy',JSON.stringify(rpmPlan));
}

function renderStrCard(cat){
  const prog=mapProgress(cat);
  const pct=prog.total>0?Math.round(prog.done/prog.total*100):0;
  const sc=scoreColor(cat.score);
  const ttItems=(cat.threeToThrive||[]).slice(0,3).map((t,i)=>`<div class="str-3tt-item"><span class="str-3tt-num">${i+1}</span><span>${t.replace(/</g,'&lt;')}</span></div>`).join('');
  return`<div class="str-card" onclick="openStratCategory('${cat.id}')" style="border-color:${cat.color}22">
    <div class="str-card-top">
      <div class="str-cat-chip" style="background:${cat.color}">${cat.number}</div>
      <div class="str-card-title">
        <div class="str-card-name">${cat.name.replace(/</g,'&lt;')}</div>
        ${cat.nickname?`<div class="str-card-nick">${cat.nickname.replace(/</g,'&lt;')}</div>`:''}
      </div>
      <div class="str-score-pill" style="background:${sc}">${cat.score}/10</div>
    </div>
    <div class="str-card-vis">${(cat.vision||'').replace(/</g,'&lt;')}</div>
    ${ttItems?`<div class="str-card-3tt"><div class="str-3tt-lbl">3 to Thrive</div>${ttItems}</div>`:''}
    ${prog.total>0?`<div class="str-map-footer">
      <div class="str-map-bar-wrap"><div class="str-map-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
      <span class="str-map-stat">${prog.done}/${prog.total} MAP</span>
    </div>`:''}
  </div>`;
}

function renderStrExpanded(cat){
  const sc=scoreColor(cat.score);
  const prog=mapProgress(cat);
  const pct=prog.total>0?Math.round(prog.done/prog.total*100):0;
  const em=strEditMode;

  function textSec(label,field,val,multiline){
    const safe=(val||'').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    let content;
    if(em){
      content=multiline===false
        ?`<input class="str-edit-inp" id="strf-${field}" value="${safe}">`
        :`<textarea class="str-edit-ta" id="strf-${field}" rows="4">${(val||'').replace(/</g,'&lt;')}</textarea>`;
    }else{
      content=`<div class="str-text-block">${(val||'<span style="color:#ccc;font-style:italic">Not set</span>').replace(/</g,'&lt;')}</div>`;
    }
    return`<div class="str-section"><div class="str-sec-lbl">${label}</div>${content}</div>`;
  }

  function tagsSec(label,field,arr){
    if(em){
      const safe=(arr||[]).join(', ').replace(/"/g,'&quot;');
      return`<div class="str-section"><div class="str-sec-lbl">${label} <span style="font-size:10px;color:#bbb;font-style:italic">comma separated</span></div><textarea class="str-edit-ta" id="strf-${field}" rows="2">${safe.replace(/</g,'&lt;')}</textarea></div>`;
    }
    const tags=(arr||[]).map(t=>`<span class="str-tag">${t.replace(/</g,'&lt;')}</span>`).join('');
    return`<div class="str-section"><div class="str-sec-lbl">${label}</div><div class="str-tag-row">${tags||'<span style="color:#ccc;font-style:italic;font-size:12px">None set</span>'}</div></div>`;
  }

  const scoreDots=Array.from({length:10},(_,i)=>{
    const n=i+1;
    const on=n<=cat.score;
    const c=scoreColor(n);
    return`<div class="str-score-dot${on?' on':''}" style="${on?'background:'+c+';border-color:'+c:''}" onclick="updateStrScore('${cat.id}',${n})" title="${n}/10"></div>`;
  }).join('');

  const mapItems=(cat.ninetyDayMap||[]).map((item,idx)=>{
    const pushed=item.pushedToTask;
    return`<div class="str-map-row${item.done?' done':''}${item.priority?' priority':''}">
      <input type="checkbox" class="str-map-cb" ${item.done?'checked':''} onchange="toggleMapDone('${cat.id}','${item.id}')">
      <span class="str-map-txt${item.done?' done-txt':''}">${item.text.replace(/</g,'&lt;')}${item.priority?' ⭐':''}</span>
      <button class="str-map-push${pushed?' pushed':''}" onclick="pushMapToTask('${cat.id}','${item.id}')" ${pushed?'disabled':''} title="${pushed?'Already pushed to Plan':'Push to Plan'}">
        ${pushed?'Pushed':'→ Plan'}
      </button>
    </div>`;
  }).join('');

  let h=`<div class="str-exp">
    <div class="str-exp-head">
      <button class="str-back-btn" onclick="closeStratCategory()">&#8592;</button>
      <div class="str-exp-color-bar" style="background:${cat.color}"></div>
      <div class="str-exp-titles">
        <div class="str-exp-name">${cat.name.replace(/</g,'&lt;')}</div>
        ${cat.nickname?`<div class="str-exp-sub">${cat.nickname.replace(/</g,'&lt;')}</div>`:''}
      </div>
      <div class="str-score-row">
        <span class="str-score-lbl">Score</span>
        <div class="str-score-dial">${scoreDots}</div>
        <span style="font-size:11px;font-weight:700;color:${sc};min-width:28px;text-align:right">${cat.score}/10</span>
      </div>
      <button class="str-edit-toggle" onclick="toggleStrEdit()">${em?'View':'Edit'}</button>
    </div>
    <div class="str-exp-body">`;

  h+=textSec('Vision','vision',cat.vision,true);
  h+=textSec('Purpose','purpose',cat.purpose,true);
  h+=tagsSec('Roles','roles',cat.roles);
  h+=tagsSec('3 to Thrive','threeToThrive',cat.threeToThrive);
  h+=tagsSec('Resources','resources',cat.resources);
  h+=textSec('1-Year Result','oneYearResult',cat.oneYearResult,true);
  h+=textSec('1-Year Purpose','oneYearPurpose',cat.oneYearPurpose,true);
  h+=textSec('90-Day Result','ninetyDayResult',cat.ninetyDayResult,true);
  h+=textSec('90-Day Purpose','ninetyDayPurpose',cat.ninetyDayPurpose,true);

  h+=`<div class="str-section">
    <div class="str-sec-lbl">90-Day MAP (Massive Action Plan)
      <span style="color:#aaa;font-size:10px">${prog.done}/${prog.total} done &nbsp; ${pct}%</span>
    </div>
    <div class="str-map-list">${mapItems}</div>
    <button class="str-map-add-btn" onclick="addMapItem('${cat.id}')">+ Add action</button>
  </div>`;

  h+=textSec('Weekly Integration','weeklyIntegration',cat.weeklyIntegration,true);

  if(em){
    h+=`<div class="str-save-row">
      <button class="str-cancel-btn" onclick="toggleStrEdit()">Cancel</button>
      <button class="str-save-btn" onclick="saveStratCategory('${cat.id}')">Save changes</button>
    </div>`;
  }

  h+=`</div></div>`;
  return h;
}

function renderStrategy(){
  const el=document.getElementById('strategy-view');
  if(!el)return;

  if(strExpandedId){
    const cat=rpmPlan.categories.find(c=>c.id===strExpandedId);
    if(!cat){strExpandedId=null;renderStrategy();return;}
    const totalMap=rpmPlan.categories.reduce((a,c)=>a+(c.ninetyDayMap||[]).length,0);
    const doneMap=rpmPlan.categories.reduce((a,c)=>a+(c.ninetyDayMap||[]).filter(i=>i.done).length,0);
    el.innerHTML=`<div class="str-header-row">
      <button class="str-cancel-btn" onclick="closeStratCategory()" style="display:flex;align-items:center;gap:5px">&#8592; All Categories</button>
      <div class="str-overview-stats">
        <div class="str-ov-stat"><div class="str-ov-num">${doneMap}/${totalMap}</div><div class="str-ov-lbl">MAP Done</div></div>
      </div>
    </div>`+renderStrExpanded(cat);
    return;
  }

  const personal=rpmPlan.categories.filter(c=>c.part==='personal');
  const professional=rpmPlan.categories.filter(c=>c.part==='professional');
  const avgScore=rpmPlan.categories.length>0?Math.round(rpmPlan.categories.reduce((a,c)=>a+c.score,0)/rpmPlan.categories.length*10)/10:0;
  const totalMap=rpmPlan.categories.reduce((a,c)=>a+(c.ninetyDayMap||[]).length,0);
  const doneMap=rpmPlan.categories.reduce((a,c)=>a+(c.ninetyDayMap||[]).filter(i=>i.done).length,0);

  let h=`<div class="str-header-row">
    <div style="font-size:18px;font-weight:700;color:#222">RPM Strategic Plan</div>
    <div class="str-overview-stats">
      <div class="str-ov-stat"><div class="str-ov-num">${rpmPlan.categories.length}</div><div class="str-ov-lbl">Categories</div></div>
      <div class="str-ov-stat"><div class="str-ov-num" style="color:${scoreColor(Math.round(avgScore))}">${avgScore}</div><div class="str-ov-lbl">Avg Score</div></div>
      <div class="str-ov-stat"><div class="str-ov-num">${doneMap}/${totalMap}</div><div class="str-ov-lbl">MAP Done</div></div>
    </div>
  </div>`;

  h+=`<div class="str-part-label">Personal Life</div>`;
  h+=`<div class="str-grid">`;
  personal.forEach(cat=>h+=renderStrCard(cat));
  h+=`</div>`;

  h+=`<div class="str-part-label">Professional & Business</div>`;
  h+=`<div class="str-grid">`;
  professional.forEach(cat=>h+=renderStrCard(cat));
  h+=`</div>`;

  el.innerHTML=h;
}

function openStratCategory(id){
  strExpandedId=id;
  strEditMode=false;
  renderStrategy();
  window.scrollTo({top:0,behavior:'smooth'});
}

function closeStratCategory(){
  strExpandedId=null;
  strEditMode=false;
  renderStrategy();
}

function toggleStrEdit(){
  strEditMode=!strEditMode;
  renderStrategy();
}

function saveStratCategory(id){
  const cat=rpmPlan.categories.find(c=>c.id===id);
  if(!cat)return;
  function gv(fid){const el=document.getElementById('strf-'+fid);return el?el.value:''}
  function gvArr(fid){const v=gv(fid);return v.split(',').map(s=>s.trim()).filter(Boolean);}
  cat.vision=gv('vision');
  cat.purpose=gv('purpose');
  cat.roles=gvArr('roles');
  cat.threeToThrive=gvArr('threeToThrive');
  cat.resources=gvArr('resources');
  cat.oneYearResult=gv('oneYearResult');
  cat.oneYearPurpose=gv('oneYearPurpose');
  cat.ninetyDayResult=gv('ninetyDayResult');
  cat.ninetyDayPurpose=gv('ninetyDayPurpose');
  cat.weeklyIntegration=gv('weeklyIntegration');
  cat.updatedAt=TODAY;
  strEditMode=false;
  saveStrategy();
  renderStrategy();
}

function updateStrScore(catId,n){
  const cat=rpmPlan.categories.find(c=>c.id===catId);
  if(!cat)return;
  cat.score=n;
  cat.updatedAt=TODAY;
  saveStrategy();
  renderStrategy();
}

function toggleMapDone(catId,mapId){
  const cat=rpmPlan.categories.find(c=>c.id===catId);
  if(!cat)return;
  const item=(cat.ninetyDayMap||[]).find(i=>i.id===mapId);
  if(!item)return;
  item.done=!item.done;
  saveStrategy();
  renderStrategy();
}

function pushMapToTask(catId,mapId){
  const cat=rpmPlan.categories.find(c=>c.id===catId);
  if(!cat)return;
  const item=(cat.ninetyDayMap||[]).find(i=>i.id===mapId);
  if(!item||item.pushedToTask)return;
  const stream=cat.part==='personal'?'health':'innovation';
  tasks.push({
    id:uid(),
    stream,
    text:item.text,
    pri:item.priority?'priority':'normal',
    dueDate:'',
    note:'From RPM Strategy MAP: '+cat.name,
    done:false,
    subs:[],
    categoryId:'',
    createdAt:TODAY,
    isDailyVictory:false,
    isWeeklyFocus:false,
    delegateIntent:false,
    delegatedTo:'',
  });
  item.pushedToTask=true;
  saveStrategy();
  save();
  renderStrategy();
  const btn=event&&event.target?event.target:null;
  if(btn){const orig=btn.textContent;btn.textContent='Added!';btn.disabled=true;setTimeout(()=>{btn.textContent='Pushed';},1200);}
}

function addMapItem(catId){
  const cat=rpmPlan.categories.find(c=>c.id===catId);
  if(!cat)return;
  if(!cat.ninetyDayMap)cat.ninetyDayMap=[];
  const newId='mx'+catId.replace('rpm-','')+'_'+Date.now().toString(36);
  cat.ninetyDayMap.push({id:newId,text:'New action item',done:false,priority:false,pushedToTask:false});
  saveStrategy();
  renderStrategy();
}

// ── Dark mode ─────────────────────────────────────────────────────────────────
function toggleDark(){
  const isDark=document.body.classList.toggle('dark');
  localStorage.setItem('rpm_dark',isDark?'1':'0');
  document.getElementById('dark-toggle').textContent=isDark?'☀️':'🌙';
}
// ── API bar ───────────────────────────────────────────────────────────────────
function toggleApiBar(){document.getElementById('api-bar-expanded').style.display=document.getElementById('api-bar-expanded').style.display==='none'?'block':'none';}
function updateApiPill(){const pill=document.getElementById('api-status-pill');if(!pill)return;if(sheetUrl){pill.textContent='✓ Connected';pill.classList.add('connected');}else{pill.textContent='⚡ Not connected';pill.classList.remove('connected');}}

// ── Render all ────────────────────────────────────────────────────────────────
function renderAll(){
  renderStats();
  if(tab==='plan')renderPlan();
  else if(tab==='add')renderAdd();
  else if(tab==='categories')renderCategories();
  else if(tab==='analytics')renderAnalytics();
  else if(tab==='ai'){renderChat();renderChatQuickPrompts();}
  else if(tab==='strategy')renderStrategy();
}
function toggleSec(id){openSecs[id]=openSecs[id]===false?true:false;renderAll();}
function setTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['plan','add','categories','analytics','ai','strategy'].forEach(v=>{document.getElementById(v+'-view').style.display=t===v?'block':'none';});
  renderAll();
  if(t==='ai') document.getElementById('chat-input')?.focus();
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('main-tabs').innerHTML=`
  <button class="tab on" data-t="plan" onclick="setTab('plan')">Plan</button>
  <button class="tab" data-t="add" onclick="setTab('add')">+ Add task</button>
  <button class="tab" data-t="categories" onclick="setTab('categories')">Categories</button>
  <button class="tab" data-t="analytics" onclick="setTab('analytics')">Analytics</button>
  <button class="tab" data-t="ai" onclick="setTab('ai')">🤖 AI Assistant</button>
  <button class="tab" data-t="strategy" onclick="setTab('strategy')">📋 Strategy</button>`;
const savedUrl=localStorage.getItem('rpm_sheet_url');
if(savedUrl)sheetUrl=savedUrl;
if(sheetUrl){const u=document.getElementById('sheet-url');const s=document.getElementById('sheet-status');if(u)u.value=sheetUrl;if(s)s.textContent='Connected';}
updateApiPill();
// Restore filter state across sessions
try{const sf=localStorage.getItem('rpm_filters');if(sf)activeFilters=new Set(JSON.parse(sf));}catch(e){}
// Load strategic priorities
loadPriorities();
// Load strategy plan
loadStrategy();
// Init dark mode
if(localStorage.getItem('rpm_dark')==='1'){document.body.classList.add('dark');document.getElementById('dark-toggle').textContent='☀️';}
(async()=>{await loadData();resetStaleVictories();renderAll();})();
</script>
